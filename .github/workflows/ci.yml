name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare extension bundle
        run: npm run prepare:extension
      - name: Verify project
        run: npm run verify
      - name: Package VSIX
        run: npm run package:vsix
