<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThreadVault</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="density-compact">
    <div class="layout">
      <aside class="sidebar-rail">
        <section class="rail-brand">
          <span class="brand-icon brand-slot" data-icon="brand" aria-hidden="true"></span>
          <span class="rail-brand-label" data-i18n="railBrand">Vault</span>
        </section>

        <nav class="rail-nav" aria-label="ThreadVault navigation">
          <button class="rail-button is-primary" type="button" data-scroll-target="sidebar-overview">
            <span class="nav-icon" data-icon="overview" aria-hidden="true"></span>
            <span class="rail-label" data-i18n="overview">Overview</span>
          </button>
          <button class="rail-button" type="button" data-scroll-target="sidebar-sessions">
            <span class="nav-icon" data-icon="sessions" aria-hidden="true"></span>
            <span class="rail-label" data-i18n="sessions">Sessions</span>
          </button>
        </nav>

        <div class="rail-spacer"></div>

        <button
          id="settings-button"
          class="rail-button rail-settings-button"
          type="button"
          aria-label="Settings"
          aria-expanded="false"
          aria-controls="settings-panel"
          data-i18n-aria-label="settings"
        >
          <span class="nav-icon" data-icon="settings" aria-hidden="true"></span>
          <span class="rail-label" data-i18n="settings">Settings</span>
        </button>
      </aside>

      <section id="settings-panel" class="settings-panel" hidden aria-label="Settings" data-i18n-aria-label="settings">
        <div class="settings-header">
          <div>
            <p class="settings-kicker" data-i18n="settingsKicker">Appearance</p>
            <h2 data-i18n="settings">Settings</h2>
          </div>
          <button id="settings-close" class="toast-close settings-close" type="button" aria-label="Close settings" data-i18n-aria-label="closeSettings">
            <span class="button-icon" data-icon="close" aria-hidden="true"></span>
          </button>
        </div>

        <div class="settings-group">
          <div class="settings-label-row">
            <span class="mini-icon" data-icon="theme" aria-hidden="true"></span>
            <span data-i18n="theme">Theme</span>
          </div>
          <div class="segmented-control" role="group" aria-label="Theme" data-i18n-aria-label="theme">
            <button type="button" data-setting="theme" data-setting-value="light" data-i18n="themeLight">Light</button>
            <button type="button" data-setting="theme" data-setting-value="dim" data-i18n="themeDim">Graphite</button>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-label-row">
            <span class="mini-icon" data-icon="language" aria-hidden="true"></span>
            <span data-i18n="language">Language</span>
          </div>
          <div class="segmented-control" role="group" aria-label="Language" data-i18n-aria-label="language">
            <button type="button" data-setting="language" data-setting-value="en">EN</button>
            <button type="button" data-setting="language" data-setting-value="zh">&#20013;</button>
          </div>
        </div>
      </section>

      <aside class="sidebar-drawer">
        <section class="brand-shell">
          <div class="brand-row">
            <div class="brand-mark">
              <span class="brand-icon brand-slot" data-icon="brand" aria-hidden="true"></span>
            </div>
            <div class="brand-copy">
              <p class="eyebrow" data-i18n="brandEyebrow">Local AI Archive</p>
              <h1>ThreadVault</h1>
            </div>
          </div>
        </section>

        <section id="sidebar-overview" class="drawer-section drawer-anchor-section">
          <section class="panel panel-overview">
            <div class="panel-heading panel-heading-compact">
              <p class="panel-title" data-i18n="overview">Overview</p>
              <button id="scan-button" class="primary-button overview-scan-button" type="button">
                <span class="button-icon" data-icon="scan" aria-hidden="true"></span>
                <span class="button-label" data-i18n="rescan">Rescan</span>
              </button>
            </div>
            <div class="overview-command-row">
              <div class="overview-copy">
                <p class="overview-kicker" data-i18n="librarySnapshot">Library snapshot</p>
                <p id="overview-summary" class="overview-summary" data-i18n="waitingForSessions">Waiting for local sessions to load.</p>
              </div>
              <div id="overview-metrics" class="overview-metrics"></div>
            </div>
            <div class="overview-focus-row">
              <span class="scope-title" data-i18n="currentFocus">Current focus</span>
              <span id="overview-focus" class="overview-focus" data-i18n="allSources">All sources</span>
            </div>
            <div class="scope-block scope-block-first">
              <div class="scope-header">
                <span class="scope-title" data-i18n="sources">Sources</span>
              </div>
              <div id="stats" class="source-grid"></div>
            </div>
          </section>
        </section>

        <section id="sidebar-sessions" class="drawer-section drawer-anchor-section">
          <section class="panel panel-sessions">
            <div class="list-header">
              <div>
                <span data-i18n="sessions">Sessions</span>
                <p id="list-state" class="list-state" data-i18n="allSources">All sources</p>
              </div>
              <span id="session-count">0</span>
            </div>
            <label class="search-shell session-search">
              <span class="search-icon" data-icon="search" aria-hidden="true"></span>
              <input
                id="search-input"
                class="search-input"
                type="search"
                placeholder="Search sessions"
                data-i18n-placeholder="searchSessions"
              />
            </label>
            <div class="filter-state-inputs" hidden>
              <input id="favorites-only" type="checkbox" />
              <input id="include-archived" type="checkbox" />
            </div>
            <div id="session-status-strip" class="status-strip session-status-strip" role="group" aria-label="Quick filters" data-i18n-aria-label="quickFilters"></div>
            <div id="session-list" class="session-list"></div>
          </section>
        </section>
      </aside>

      <button
        id="drawer-resizer"
        class="drawer-resizer"
        type="button"
        aria-label="Resize session library"
        data-i18n-aria-label="drawerResize"
        title="Drag to resize the session library"
        data-i18n-title="drawerResizeTitle"
      ></button>

      <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" hidden aria-label="Close session library" data-i18n-aria-label="sidebarClose"></button>

      <main class="content">
        <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
        <div class="topbar">
          <div class="topbar-left">
            <button id="sidebar-toggle" class="secondary-button embed-toggle" type="button">
              <span class="button-icon" data-icon="sessions" aria-hidden="true"></span>
              <span class="button-label" data-i18n="library">Library</span>
            </button>
            <div id="topbar-active-state" class="topbar-active-state" data-i18n="allSources">All sources</div>
          </div>
          <div class="topbar-right">
            <button id="open-browser-button" class="ghost-button topbar-browser-button" type="button">
              <span class="button-icon" data-icon="browser" aria-hidden="true"></span>
              <span class="button-label" data-i18n="openInBrowser">Open in browser</span>
            </button>
          </div>
        </div>
        <section id="session-detail" class="detail empty-state">
          <h2 data-i18n="selectSession">Select a session</h2>
          <p class="muted" data-i18n="archiveReady">Your local archive is ready.</p>
        </section>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
